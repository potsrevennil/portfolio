# Example securities config. Copy to securities.toml and edit.
#
# Which securities you hold is yours, not the importer's, so securities.toml is
# gitignored and the code reads whatever it is given. This file documents the
# shape with invented securities and is the one that ships.
#
# Read from the working directory on every run. Both sections are optional.


# Security name → Yahoo Finance ticker: .TW for TWSE listings, .TWO for TPEx.
# Some exports name a security rather than giving its ticker. Every name such
# an export contains needs an entry here; a missing one fails the import and
# says which name.
[symbols]
"範例科技" = "ZZ01.TW"
"範例高股息" = "ZZ02.TW"
"範例公司債" = "ZZ03B.TWO"

# Splits no export reports. ratio is new shares per old share, so a 4-for-1
# split is 4. Dates are quoted, as YYYY-MM-DD.
[[splits]]
symbol = "ZZ01.TW"
date = "2024-07-01"
ratio = 4
