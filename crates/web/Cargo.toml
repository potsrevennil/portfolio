[package]
name              = "web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name              = "web"
required-features = ["ssr"]

[dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
# Links encode alike on both halves; leptos_router escapes differently in each.
form_urlencoded = "1.2"
ledger-types    = { workspace = true }
leptos          = "0.8"
leptos_meta     = "0.8"
leptos_router   = "0.8"
# Shared: the view model carries exact amounts to the client.
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
# Pinned to the wasm-bindgen the devShell's cargo-leptos bundles (nixpkgs); the
# two must match exactly. web-sys is the release built against it.
wasm-bindgen = { version = "=0.2.100", optional = true }
web-sys      = { version = "=0.3.77", features = ["HtmlDetailsElement", "Storage", "Window"] }

# Server only.
anyhow      = { workspace = true, optional = true }
axum        = { version = "0.8", optional = true }
chrono      = { workspace = true, features = ["clock"], optional = true }
db          = { workspace = true, optional = true }
ledger      = { workspace = true, optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio       = { workspace = true, optional = true }

[dev-dependencies]
# Browser journeys (tests/browser.rs) drive a headless Chromium through
# chromedriver; no TLS, both are on localhost.
fantoccini          = { version = "0.21", default-features = false }
http-body-util      = "0.1"
hyper-util          = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
prices              = { workspace = true }
rust_decimal_macros = { workspace = true }
sqlx                = { workspace = true }
tempfile            = { workspace = true }
tower               = { version = "0.5", features = ["util"] }

[features]
default = ["ssr"]
hydrate = ["dep:console_error_panic_hook", "dep:wasm-bindgen", "leptos/hydrate"]
ssr = [
  "dep:anyhow",
  "dep:axum",
  "dep:chrono",
  "dep:leptos_axum",
  "dep:db",
  "dep:ledger",
  "dep:tokio",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]

# Read by cargo-leptos (`cargo leptos build|serve|watch`).
[package.metadata.leptos]
output-name = "web"
# Every release build names its files after their content, so a browser can
# never pair a cached web.js with a freshly built web.wasm — which fails to
# link and leaves the page rendered but dead.
hash-files           = true
site-root            = "target/site"
site-pkg-dir         = "pkg"
style-file           = "style/main.css"
site-addr            = "127.0.0.1:3000"
reload-port          = 3001
bin-features         = ["ssr"]
bin-default-features = false
lib-features         = ["hydrate"]
lib-default-features = false
