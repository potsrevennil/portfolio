# scripts/scan-sensitive's rules: gitleaks' own, plus personal-data shapes that
# have no place in this repo, real or synthetic. Your own account numbers go in
# the gitignored deny list instead (see sensitive-patterns.example), so these
# rules leak nothing.
title = "portfolio"

[extend]
useDefault = true

[[rules]]
id          = "tw-national-id"
description = "Taiwanese national ID or resident certificate number"
regex       = '''\b[A-Z][1289]\d{8}\b'''

[[rules]]
id          = "payment-card"
description = "Visa, Mastercard or JCB card number; synthetic ones start with 0"
regex       = '''\b(?:4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|35\d{2})[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}\b'''

[[rules]]
id          = "payment-card-amex"
description = "American Express card number"
regex       = '''\b3[47]\d{2}[ -]?\d{6}[ -]?\d{5}\b'''

[[rules]]
id          = "tw-mobile"
description = "Taiwanese mobile number"
regex       = '''\b09\d{2}-?\d{3}-?\d{3}\b'''
