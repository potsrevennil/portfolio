# Example chart of accounts. Copy to mapping.toml and edit.
#
# Everything here is yours, not the importer's: which bank you use, which
# account numbers, which categories map where, and who you split bills with.
# mapping.toml is gitignored for that reason. This file documents the shape
# with invented values and is the one that ships.
#
# Beancount rejects non-ASCII account names and Fava cannot alias them, so
# readability comes from keeping the tree shallow. Expenses are capped at two
# levels and the detail moves into tags, which Fava can filter on.
#
# Asset and liability accounts keep their leaf name: a tag cannot hold a
# balance, so collapsing them would lose the per-account figure.
#
# A value may be a plain account name, or { account = "...", tags = [...] }.

# The bank whose statements drive the ledger. Account numbers are yours, so the
# code reads whichever numbers it is given rather than knowing any itself.
[institution]
app_account            = "銀行"                                 # what the bookkeeping app calls them together
primary                = "Assets:Bank:Main:Savings"           # where activity with no statement lands
settlement             = "Assets:Bank:Main:Investment"        # where securities settlement passes
settlement_app_account = "證券"                                 # app account that means settlement
clearing               = "Assets:Bank:Main:Transfer-Clearing" # internal transfers still in flight

# Statement account number → ledger account, for every bank with statements.
# A second bank's account gets its own pool of app records when [accounts] maps
# one app account to exactly its ledger account.
[institution.accounts]
"123456789012" = "Assets:Bank:Main:Savings"
"210987654321" = "Assets:Bank:Main:Investment"
"345678901234" = "Assets:Bank:Main:FX"         # foreign-currency account, one per currency
"456789012345" = "Assets:Bank:LineBank"        # LINE Bank; its statements' folder names it

# Where a statement line goes when no app record explains it. The statement
# alone tells us only the direction, so that is all the default can use.
[fallback]
income  = "Income:Uncategorized"
expense = "Expenses:Uncategorized"

# Except where the bank's own wording says what the line is. This is per-bank
# phrasing, which is why it is configured rather than compiled in.
[fallback.descriptions]
"存款息"  = "Income:Interest"
"跨行費用" = "Expenses:Fees:Bank"
"手續費"  = "Expenses:Fees:Bank"

# Opening balances are transfers in corrected/transactions.csv between the
# account and 起鼓 (Equity:Opening-Balances, below).

# Spending categories, as the app names them. Several may share one account;
# the 中文總覽 page shows the first and lists the rest as a tooltip.
[expenses]
"交通" = "Expenses:Transport"
"咖啡" = { account = "Expenses:Food", tags = ["coffee"] }
"居家" = "Expenses:Home"
"食材" = { account = "Expenses:Food", tags = ["groceries"] }
"飲食" = { account = "Expenses:Food", tags = ["dining"] }

# Earning categories. Keyed separately because one app category can mean either
# depending on direction: 投資 is a fee when paid and a return when received.
[income]
"投資" = "Income:Investment"
"薪資" = "Income:Salary"
"回饋" = "Income:Rebates"

# Accounts the app names, including the ones no statement covers.
[accounts]
"現金" = "Assets:Cash"
"銀行" = "Assets:Bank:Main"
# Mapped to exactly a statement's account: matched against that statement only.
"外幣"   = "Assets:Bank:Main:FX"
"LINE" = "Assets:Bank:LineBank"
"信用卡"  = { account = "Liabilities:Card", tags = ["card"] }
"應收款"  = "Assets:Split:Others"
"證券"   = "Assets:Broker:Main:Holdings"                     # listed holdings, by broker
"起鼓"   = "Equity:Opening-Balances"                         # opening balances

# Accounts whose balance is what was paid, not what it is worth: an unlisted
# holding has no market price, so adding it to a total would read as a
# valuation nobody made. Reports show these at cost, outside the totals, one
# holding per account under the root (Assets:Unlisted:<company>).
[at_cost]
accounts = ["Assets:Unlisted"]

# Split accounts: running two-way balances with a person or group (current
# accounts), one account per person or group, and the sign says who owes whom —
# positive, they owe you; negative, you owe them. The freeze therefore lets
# these close negative. List every subtree that holds them, e.g. bill splits and
# advances an employer repays. (Formerly [counterparty], which is now an error.)
[split_accounts]
roots = ["Assets:Split"]

# Accounts no institution reports on, such as cash: only a balance you count
# checks them (`portfolio count`). `check --mapping` lists any that hold
# postings but have never been counted; that is a note, not a failure.
[counted]
roots = ["Assets:Cash"]

# Each card's credit limit, as its statement prints it (信用額度). The 資產 page
# shows credit used and left per card, to check against the card's own app,
# which counts an instalment purchase in full from the day it is made.
[credit_limits]
"Liabilities:Card" = 50000

# Single records whose app category is too coarse, keyed by the record's UUID
# (the export's last column). The app allows one category per record, so a
# once-off event the category list has no word for lands under whatever is
# closest — and then reads as an ordinary fee or an ordinary windfall.
#
# Both sides of one episode can point at the same account, so its running
# balance is the net rather than a large expense in one year and a large income
# in another. An id matching no record is reported rather than ignored.
[overrides]
"00000000-0000-4000-8000-000000000000" = { account = "Expenses:Investment:Loss", narration = "虧損", tags = [
  "example",
] }

# Chinese labels for the account tree, used to relabel Fava's reports. A
# category or institution above is relabelled from its own key; this covers the
# grouping levels, the accounts the app names in Latin script, and any account
# that several categories collapse into. Expenses:Food takes 飲食, 食材 and 咖啡
# (they differ only by tag), so none of them can name it — clicking 咖啡 would
# open every Food record — and it is labelled here instead.
[display]
"Assets"                  = "資產"
"Assets:Bank"             = "銀行"
"Assets:Bank:Main"        = "範例銀行"
"Assets:Bank:LineBank"    = "LINE Bank"
"Assets:Broker"           = "券商"
"Assets:Cash"             = "現金"
"Equity"                  = "權益"
"Equity:Opening-Balances" = "期初餘額"
"Expenses"                = "支出"
"Expenses:Food"           = "餐飲"
"Income"                  = "收入"
"Liabilities"             = "負債"
