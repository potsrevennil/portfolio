[package]
name    = "portfolio"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "types", "web"]

[lib]
name = "portfolio"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
console = "0.15.8"
csv = "1.3.1"
dialoguer = "0.11.0"
env_logger = "0.10"
futures = "0.3.31"
gxhash = "3.5.0"
log = "0.4"
portfolio-types = { path = "types", features = ["clap"] }
regex = "1.10.0"
rust_decimal = { version = "1.38", features = ["serde-str"] }
rust_decimal_macros = "1.38"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "macros",
  "chrono",
  "bigdecimal",
] }
strum = "0.26"
strum_macros = "0.26"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
unicode-width = "0.1.11"
yfinance-rs = "0.3.0"

[build-dependencies]
anyhow = "1.0"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "macros",
  "chrono",
  "bigdecimal",
] }
tempfile = "3.10.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
portfolio = { path = "." }
tempfile  = "3.10.0"
