[package]
name    = "portfolio"
version = "0.1.0"
edition = "2021"

[lib]
name = "portfolio"
path = "src/lib.rs"

[dependencies]
clap                = { version = "4.5.47", features = ["derive"] }
csv                 = "1.3.1"
serde               = { version = "1.0.225", features = ["derive"] }
unicode-width       = "0.1.11"
chrono              = { version = "0.4", features = ["serde"] }
rust_decimal        = { version = "1.38", features = ["serde-str"] }
rust_decimal_macros = "1.38"
serde_json          = "1.0"
anyhow              = "1.0"
sqlx                = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "bigdecimal"] }
tokio               = { version = "1", features = ["full"] }
yfinance-rs         = "0.3.0"
log                 = "0.4"
env_logger          = "0.10"
thiserror = "1.0"
futures = "0.3.31"
gxhash = "3.5.0"
regex = "1.10.0"
dialoguer = "0.11.0"
console = "0.15.8"
strum = "0.26"
strum_macros = "0.26"
toml = "0.8"

[build-dependencies]
tempfile = "3.10.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "bigdecimal"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
portfolio = { path = "." }
tempfile = "3.10.0"
