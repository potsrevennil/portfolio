[package]
name    = "template"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
csv = "1.3.1"
serde = { version = "1.0.225", features = ["derive"] }
unicode-width = "0.1.11"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.35", features = ["serde-str"] }
rust_decimal_macros = "1.35"
serde_json = "1.0"
