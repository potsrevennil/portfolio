[workspace]
members = ["crates/*"]
# `cargo run -- freeze …` from the root runs the CLI, as before the split.
default-members = ["crates/cli"]
resolver        = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# One version per dependency, shared by every member.
anyhow = "1.0"
# No default features: ledger-types compiles to wasm, which has no clock.
# Crates that read the time add "clock".
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
clap = { version = "4.5.47", features = ["derive"] }
console = "0.15.8"
csv = "1.3.1"
dialoguer = "0.11.0"
env_logger = "0.10"
futures = "0.3.31"
gxhash = "3.5.0"
log = "0.4"
regex = "1.10.0"
rust_decimal = { version = "1.38", features = ["serde-str"] }
rust_decimal_macros = "1.38"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-rustls",
  "sqlite",
  "macros",
  "chrono",
  "bigdecimal",
] }
strum = "0.26"
strum_macros = "0.26"
tempfile = "3.10.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
unicode-width = "0.1.11"
yfinance-rs = "0.3.0"

db           = { path = "crates/db" }
import       = { path = "crates/import" }
ledger       = { path = "crates/ledger" }
ledger-types = { path = "crates/ledger-types" }
portfolio    = { path = "crates/portfolio" }
prices       = { path = "crates/prices" }
store        = { path = "crates/store" }
